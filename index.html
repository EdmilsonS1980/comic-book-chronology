<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Fun Comics #1 - 1935</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .header {
        width: 100%;
        padding: 12px;
        text-align: center;
        background: #181818;
        border-bottom: 1px solid #333;
    }

    .header h1 {
        margin: 0;
        font-size: 18px;
    }

    .header p {
        margin: 5px 0 0;
        font-size: 13px;
        color: #aaa;
    }

    .reader {
        width: 100%;
        height: calc(100vh - 70px);
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .fallback {
        text-align: center;
        padding: 30px;
        display: none;
    }

    .fallback a {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 20px;
        background: white;
        color: black;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="header">
    <h1>New Fun Comics #1</h1>
    <p>February 1935</p>
</div>

<div class="reader">

    <iframe
        src="https://www.mediafire.com/file/4drt7rcc1uo7xxo/New_Fun_001_1935_WEB_OPTIMIZED-1.pdf/file"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
